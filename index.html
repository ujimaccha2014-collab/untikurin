<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <title>High Quality 60FPS Stream</title>
    <script src='https://cdn.jsdelivr.net/npm/jmuxer@2.0.5/dist/jmuxer.min.js'></script>
</head>
<body style='margin:0;background:#000;overflow:hidden;'>
    <video id='player' autoplay muted playsinline style='width:100vw;height:100vh;object-fit:contain;'></video>
    <script>
        const jmuxer = new JMuxer({
            node: 'player',
            mode: 'video',
            flushingTime: 0,
            maxDelay: 10,
            fps: 60,
            debug: false
        });
        const ws = new WebSocket('wss://shy-ducks-bet.loca.lt/stream');
        ws.binaryType = 'arraybuffer';
        ws.onmessage = (e) => {
            if (e.data instanceof ArrayBuffer) {
                jmuxer.feed({ video: new Uint8Array(e.data) });
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta charset='UTF-8'></head>
<body style='margin:0;background:#000;'>
    <img id='v' style='width:100vw;height:100vh;object-fit:contain;'>
    <script>
        const img = document.getElementById('v');
        function connect(protocol) {
            console.log(protocol + ' で接続テスト中...');
            const ws = new WebSocket(protocol + '://long-files-do.loca.lt/stream');
            ws.binaryType = 'blob';
            ws.onmessage = (e) => { img.src = URL.createObjectURL(e.data); };
            ws.onopen = () => { console.log(protocol + ' で接続成功！'); };
            ws.onerror = () => {
                if (protocol === 'wss') {
                    connect('ws'); // wssがダメなら自動でwsに切り替える
                }
            };
        }
        connect('wss'); // まずは安全な方からスタート
    </script>
</body>
</html>

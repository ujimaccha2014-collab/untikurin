<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NET8 Remote Desktop</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            font-family: sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        /* Canvasを画面中央に配置し、クリックしやすくする */
        canvas { 
            display: block; 
            max-width: 100%; 
            max-height: 100%; 
            cursor: crosshair; /* 操作可能であることを示すカーソル */
            background: #222;
        }
        #status { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: #0f0; 
            background: rgba(0,0,0,0.7); 
            padding: 8px 12px; 
            pointer-events: none; /* ステータスバーがクリックを邪魔しないようにする */
            border-radius: 4px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="status">Connecting to Server...</div>
    <!-- tabIndexを追加してキーボードイベントを受け取れるようにする -->
    <canvas id="display" tabindex="0"></canvas>

    <script>
        const canvas = document.getElementById('display');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
const socket = new WebSocket('ws://127.0.0.1:5000/stream');
        socket.binaryType = "blob";

        // --- 画面受信 ---
        socket.onmessage = async (event) => {
            if (event.data instanceof Blob) {
                const url = URL.createObjectURL(event.data);
                const img = new Image();
                img.onload = () => {
                    if (canvas.width !== img.width) {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    status.innerText = "Connected - 60FPS Streaming";
                };
                img.src = url;
            }
        };

        // --- 入力送信 ---
        const sendControl = (data) => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(data));
            }
        };

        // --- マウス操作 (Canvas内の相対座標を計算) ---
        const handleMouse = (e, type) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            // 範囲外クリックを無視
            if (x < 0 || x > 1 || y < 0 || y > 1) return;
            
            sendControl({ type: type, x: x, y: y });
        };

        canvas.addEventListener('mousemove', (e) => handleMouse(e, "mousemove"));
        canvas.addEventListener('mousedown', (e) => {
            canvas.focus(); // クリックしたときにCanvasにフォーカスを当てる
            handleMouse(e, "mousedown");
        });
        canvas.addEventListener('mouseup', (e) => handleMouse(e, "mouseup"));
        
        // 右クリックメニューを禁止（操作の邪魔になるため）
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // --- キーボード操作 ---
        // canvasではなくwindow全体で取得すると確実
        window.addEventListener('keydown', (e) => {
            // F12やCtrl+Rなどのブラウザ機能を邪魔しないよう、特定のキーのみ送信
            sendControl({ type: "keydown", keyCode: e.keyCode });
            
            // Tabや矢印キーでブラウザがスクロールするのを防ぐ
            if([9, 37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
        });

        window.addEventListener('keyup', (e) => {
            sendControl({ type: "keyup", keyCode: e.keyCode });
        });

        // --- 貼り付け (Ctrl+V) ---
        window.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (text) {
                sendControl({ type: "paste", data: text });
                status.innerText = "Pasted text sent to server";
            }
        });

        socket.onopen = () => {
            status.innerText = "Connected";
            status.style.color = "#0f0";
            canvas.focus(); // 起動時にフォーカス
        };
        socket.onclose = () => {
            status.innerText = "Disconnected";
            status.style.color = "#f00";
        };
        socket.onerror = () => {
            status.innerText = "Connection Error";
            status.style.color = "#f00";
        };
    </script>
</body>
</html>

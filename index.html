<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NET8 Remote Desktop - Ready to Connect</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; font-family: sans-serif; color: #aaa; }
        .loading-box { text-align: center; padding: 20px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #4CAF50; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-box">
        <div class="spinner"></div>
        <p>🤖 お家からの接続URLが同期されるのを待っています...</p>
        <p style="font-size: 12px; color: #666;">（一度もお家でC#を起動していないか、現在同期中です）</p>
    </div>
</body>
</html>

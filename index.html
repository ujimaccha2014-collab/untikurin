<!DOCTYPE html>
<html>
<head><meta charset='UTF-8'><title>Local Stream</title></head>
<body style='margin:0;background:#000;overflow:hidden;'>
    <img id='v' style='width:100vw;height:100vh;object-fit:contain;'>
    <script>
        const img = document.getElementById('v');
        function updateImage() {
            img.src = 'http://localhost:5000/screenshot?t=' + Date.now();
        }
        img.onload = () => { setTimeout(updateImage, 30); };
        img.onerror = () => { setTimeout(updateImage, 500); };
        updateImage();
    </script>
</body>
</html>

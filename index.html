<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NET8 Remote Desktop - MultiMonitor & Clipboard (No-WS Fast Version)</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            overflow: hidden; 
            font-family: sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        canvas { 
            display: block; 
            max-width: 100%; 
            max-height: 100%; 
            cursor: crosshair;
            background: #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #status { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: #0f0; 
            background: rgba(0,0,0,0.7); 
            padding: 8px 12px; 
            pointer-events: none;
            border-radius: 4px;
            z-index: 100;
            font-size: 14px;
        }
        #control-panel {
            position: absolute; 
            top: 10px; 
            left: 220px; 
            z-index: 101;
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 8px 14px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #444;
        }
        #clipBtn {
            background: #ff9800;
            color: #fff;
            border: none;
            display: none;
        }
        #clipBtn:hover {
            background: #e68a00;
        }
    </style>
</head>
<body>
    <div id="status">Connecting to Server...</div>
    
    <div id="control-panel">
        <button class="btn" onclick="changeScreen(0)">📺 モニター 1</button>
        <button class="btn" onclick="changeScreen(1)">📺 モニター 2</button>
        <button id="clipBtn" class="btn" onclick="copyHostText()">📋 ホストの文字をコピー</button>
    </div>

    <canvas id="display" tabindex="0"></canvas>

    <script>
        const canvas = document.getElementById('display');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const clipBtn = document.getElementById('clipBtn');

        // 🟩 手動起動したLocalTunnelのURL（末尾のスラッシュは無し）
        const baseUrl = 'https://dezaringusuru-stream.loca.lt';
        
        let pendingHostText = ""; 

        // --- 1. 画像の定期ループ取得 ---
        function updateStream() {
            const img = new Image();
            const url = `${baseUrl}/screenshot?t=${Date.now()}`;
            
            img.onload = () => {
                if (canvas.width !== img.width) {
                    canvas.width = img.width;
                    canvas.height = img.height;
                }
                ctx.drawImage(img, 0, 0);
                status.innerText = "Connected";
                status.style.color = "#0f0";
                
                // C#側が軽量化されてるから、届いたらすぐ次の画像をリクエスト
                setTimeout(updateStream, 20);
            };
            
            img.onerror = () => {
                status.innerText = "Connection Error (Retrying...)";
                status.style.color = "#f00";
                setTimeout(updateStream, 500);
            };
            
            img.src = url;
        }

        // 定期的にクリップボードを取得（1秒ごとにして負荷を削減）
        setInterval(async () => {
            try {
                const res = await fetch(`${baseUrl}/clipboard`);
                if (res.ok) {
                    const text = await res.text();
                    if (text && text !== pendingHostText) {
                        pendingHostText = text;
                        clipBtn.style.display = "inline-block";
                        clipBtn.innerText = `📋 コピー: "${pendingHostText.substring(0, 10)}${pendingHostText.length > 10 ? '...' : ''}"`;
                    }
                }
            } catch (e) {}
        }, 1000);

        // --- 2. 💡【超重要】通信の渋滞（OPTIONS）を起こさせない送信関数 ---
        async function sendControl(data) {
            try {
                // Content-Typeをあえて「text/plain」にすることで、
                // ブラウザに「確認用の予備通信（OPTIONS）」を走らせず、直接POSTをぶち込んでサクサクにします！
                await fetch(`${baseUrl}/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(data)
                });
            } catch (e) {
                console.error("Control send error:", e);
            }
        }

        // --- 3. クリップボード同期 ---
        function copyHostText() {
            if (pendingHostText) {
                navigator.clipboard.writeText(pendingHostText).then(() => {
                    status.innerText = "Synced host clipboard!";
                    clipBtn.style.display = "none";
                }).catch(err => {
                    console.error("Clipboard write error: ", err);
                });
            }
        }

        // --- 4. モニター切り替え ---
        const changeScreen = (index) => {
            sendControl({ type: "changescreen", x: index });
            status.innerText = `Switching to Monitor ${index + 1}...`;
        };

        // --- 5. マウス操作イベント ---
        const handleMouse = (e, type) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            
            if (x < 0 || x > 1 || y < 0 || y > 1) return; 
            
            sendControl({ type: type, x: x, y: y });
        };

        canvas.addEventListener('mousemove', (e) => handleMouse(e, "mousemove"));
        canvas.addEventListener('mousedown', (e) => {
            canvas.focus();
            handleMouse(e, "mousedown");
        });
        canvas.addEventListener('mouseup', (e) => handleMouse(e, "mouseup"));
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // --- 6. キーボード操作イベント ---
        window.addEventListener('keydown', (e) => {
            sendControl({ type: "keydown", keyCode: e.keyCode });
            if([9, 37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
        });

        window.addEventListener('keyup', (e) => {
            sendControl({ type: "keyup", keyCode: e.keyCode });
        });

        // --- 7. 貼り付け操作 (Ctrl+V) ---
        window.addEventListener('paste', (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (text) {
                sendControl({ type: "paste", data: text });
                status.innerText = "Pasted text sent to host";
            }
        });

        // 配信スタート
        updateStream();
        canvas.focus();
    </script>
</body>
</html>
